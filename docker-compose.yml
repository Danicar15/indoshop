services:
  indoshop-app:
    image: indoshop:1.0
    container_name: indoshop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - laravel_storage:/var/www/html/storage
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: indoshop-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      indoshop-db:
        condition: service_healthy
    networks:
      - indoshop-network

  indoshop-nginx:
    image: nginx:alpine
    container_name: indoshop-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_storage:/var/www/html/storage:ro
    depends_on:
      - indoshop-app
    networks:
      - indoshop-network

  indoshop-db:
    image: mariadb:10.11
    container_name: indoshop-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - indoshop-network

volumes:
  mariadb_data:
  laravel_storage:

networks:
  indoshop-network:
    driver: bridge
